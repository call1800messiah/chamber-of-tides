<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kammer der Gezeiten</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <h1>Kammer der Gezeiten</h1>
  <div class="round-display">Phase <span id="phaseNum">1</span>/3 &mdash; Runde <span id="roundNum">0</span></div>
</div>

<div class="main">
  <div class="chamber-area">
    <div class="chamber" id="chamber">
      <div class="chamber-flow" id="chamberFlow"></div>
      <div class="chamber-void"></div>
    </div>
  </div>

  <div class="sidebar">
    <div>
      <div class="section-title">Steuerung</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn btn-primary" id="btnNextRound">N&auml;chste Runde</button>
        <button class="btn btn-primary" id="btnAdvancePhase">Ritualphase voranschreiten</button>
        <div class="btn-row">
          <button class="btn" id="btnToggleFlow">Str&ouml;mung anzeigen</button>
          <button class="btn" id="btnReverseFlow">&#x21bb; Uhrzeigersinn</button>
        </div>
        <div class="section-title" style="margin-top:4px;">Blockierte Zonen</div>
        <div class="btn-row">
          <button class="btn btn-zone" id="btnZoneNW" data-zone="nw">NW</button>
          <button class="btn btn-zone" id="btnZoneNE" data-zone="ne">NO</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-zone" id="btnZoneSW" data-zone="sw">SW</button>
          <button class="btn btn-zone" id="btnZoneSE" data-zone="se">SO</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnUndo" disabled>R&uuml;ckg&auml;ngig</button>
          <button class="btn" id="btnNewGame">Neues Spiel</button>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Spieler <span style="font-size:0.65rem;opacity:0.6;">(anklicken, dann Ziel in der Kammer w&auml;hlen)</span></div>
      <div id="playerList" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>

    <div>
      <div class="section-title">Verf&uuml;gbare Gegenst&auml;nde <span style="font-size:0.65rem;opacity:0.6;">(anklicken, um sie dem gew&auml;hlten Spieler zu geben)</span></div>
      <div class="unassigned-items" id="unassignedItems"></div>
    </div>

    <div>
      <div class="section-title">Legende</div>
      <div id="legend"></div>
    </div>
  </div>
</div>

<div class="ritual-overlay" id="ritualOverlay">
  <div class="ritual-message">Ritual abgeschlossen</div>
</div>

<div class="symbol-tooltip" id="tooltip"></div>

<script src="js/app.js"></script>
</body>
</html>
